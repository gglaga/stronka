<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agnieszka Giegiel - Portfolio</title>
    <style>
        /* Reset ustawień i przygotowanie tła */
        body {
            margin: 0;
            padding: 20px; /* Margines od krawędzi ekranu */
            background-color: #ffffff; /* Biała obwódka na zewnątrz ramy */
            min-height: 100vh;
            box-sizing: border-box;
            /* Używamy eleganckiej czcionki szeryfowej */
            font-family: 'Playfair Display', 'Georgia', serif; 
            color: #2c2c2c;
        }

        /* Elegancka rama na całej stronie */
        .border-frame {
            border: 1px solid #B5A898; /* Subtelny, ciepły szary/beż dla obramowania */
            background-color: #FAF8F5; /* Jasnokremowe tło wewnątrz */
            height: calc(100vh - 40px);
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Rozsuwa elementy na górę/środek/dół */
            align-items: center;
            padding: 60px 20px 40px 20px;
            box-sizing: border-box;
            text-align: center;
        }

        /* Kontener na imię i cytat na środku */
        .center-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-grow: 1; /* Wypełnia przestrzeń wypychając zdjęcie w dół */
        }

        /* Imię i nazwisko */
        h1 {
            font-size: 3.5rem;
            font-weight: normal;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin: 0 0 20px 0;
        }

        /* Sekcja cytatu */
        .quote-container {
            max-width: 600px;
            margin: 0 auto;
        }

        blockquote {
            font-size: 1.4rem;
            font-style: italic;
            color: #555555;
            margin: 0;
            line-height: 1.6;
        }

        .author {
            display: block;
            margin-top: 15px;
            font-size: 0.85rem;
            font-family: 'Helvetica Neue', Arial, sans-serif; /* Czysty font bezszeryfowy dla kontrastu */
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #888888;
        }

        /* Zdjęcie architektoniczne na dole */
        .architecture-image {
            width: 100%;
            max-width: 800px;
            height: 35vh; /* Zajmuje około 35% wysokości ekranu */
            object-fit: cover; /* Gwarantuje, że zdjęcie ładnie wypełni ramy bez zniekształceń */
            filter: grayscale(20%) contrast(110%); /* Delikatne wygaszenie kolorów dla elegancji */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); /* Bardzo miękki, elegancki cień */
        }
    </style>
</head>
<body>

    <div class="border-frame">
        
        <div class="center-content">
            <h1>Agnieszka Giegiel</h1>
            
            <div class="quote-container">
                <blockquote>
                    „Mniej znaczy więcej.”
                </blockquote>
                <span class="author">— Ludwig Mies van der Rohe</span>
            </div>
        </div>

        <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1200&q=80" alt="Elegancki budynek architektoniczny" class="architecture-image">
        
    </div>

</body>
</html>
