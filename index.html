<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stefan Stefanowicz - Szalony Minimalizm</title>
    <style>
        /* Szalone kolory i reset marginesów */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #ccff00; /* Jaskrawa limonka */
            color: #000000;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Nagłówek - Fuksja */
        header {
            background-color: #ff00ff; 
            color: #ffffff;
            padding: 25px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 5px solid #000;
        }

        header h1 {
            margin: 0;
            font-size: 2rem;
        }

        /* Główna zawartość - wyśrodkowana */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Emotikon na środku */
        .emoji {
            font-size: 120px;
            margin: 20px 0;
            text-shadow: 8px 8px 0px #00ffff; /* Cyjanowy cień */
            animation: pulse 2s infinite; /* Delikatna animacja dla podbicia szaleństwa */
        }

        /* Pudełko na cytat - styl neobrutalistyczny */
        .quote-box {
            background-color: #00ffff; /* Cyjan */
            padding: 30px;
            border: 4px solid #000;
            max-width: 600px;
            box-shadow: 12px 12px 0px #ff00ff; /* Cień w kolorze fuksji */
            text-align: center;
        }

        blockquote {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 0 0 15px 0;
            line-height: 1.4;
        }

        .author {
            font-size: 1.2rem;
            text-align: right;
            font-style: italic;
        }

        /* Stopka - Czarna, dla kontrastu */
        footer {
            background-color: #000000;
            color: #ccff00;
            text-align: center;
            padding: 15px;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* Prosta animacja emotikona */
        @keyframes pulse {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
    </style>
</head>
<body>

    <header>
        <h1>Stefan Stefanowicz</h1>
    </header>

    <main>
        <div class="emoji">🤪</div>
        
        <div class="quote-box">
            <blockquote>
                "Oszalałem, prawda?<br>
                Zupełnie, na amen. Ale powiem ci w sekrecie: tylko wariaci są coś warci."
            </blockquote>
            <div class="author">— Lewis Carroll, <i>Alicja w Krainie Czarów</i></div>
        </div>
    </main>

    <footer>
        © 2026 Stefan Stefanowicz | Zaprojektowane z kontrolowanym chaosem.
    </footer>

</body>
</html>
